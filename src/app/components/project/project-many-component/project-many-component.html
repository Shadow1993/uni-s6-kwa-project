<button matFab aria-label="Add a new project" (click)="add()" class="add-button" matTooltip="Add a new project">
  <mat-icon>add</mat-icon>
</button>
<button [hidden]="!isVisible()" matFab aria-label="Back to top" (click)="scrollToTop()" class="backtotop-button" matTooltip="Add a new task">
  <mat-icon>keyboard_arrow_up</mat-icon>
</button>
<div class="wrapper">
  @for (entity of entities(); track entity.id) {
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{entity.name}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if(entity.deadline) {
      <p>
        Deadline: {{entity.deadline | date:"dd. MMM. yyyy. '@' HH:mm"}}
      </p>
      }
    </mat-card-content>
    @if(entity.id) {
    <mat-card-actions>
      <button matIconButton (click)="detail(entity.id)" matTooltip="Show project details">
        <mat-icon>info</mat-icon>
      </button>
      <button matIconButton (click)="update(entity.id)" matTooltip="Edit project">
        <mat-icon>edit</mat-icon>
      </button>
      <button matIconButton (click)="delete(entity.id)" matTooltip="Delete project">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card-actions>
    }
  </mat-card>
  }
  @if (entities().length <= 0) {
    <mat-spinner></mat-spinner>
  }
</div>
