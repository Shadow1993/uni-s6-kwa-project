<div class="stats-container">
    <mat-card class="chart-card">
        <mat-card-header>
            <mat-card-title>Task Status Distribution</mat-card-title>
        </mat-card-header>
        <mat-card-content class="chart-wrapper">
            @if (tasksInput().length > 0) {
            <canvas baseChart [data]="pieChartData()" [options]="pieChartOptions" [type]="pieChartType">
            </canvas>
            } @else {
            <p class="no-data">No tasks available to display statistics.</p>
            }
        </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
        <mat-card-header>
            <mat-card-title>Task Priority Breakdown</mat-card-title>
        </mat-card-header>
        <mat-card-content class="chart-wrapper">
            @if (tasksInput().length > 0) {
            <canvas baseChart [data]="barChartData()" [options]="barChartOptions" [type]="barChartType">
            </canvas>
            } @else {
            <p class="no-data">No tasks available to display statistics.</p>
            }
        </mat-card-content>
    </mat-card>
</div>
